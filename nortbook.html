<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nortbook - 免费且在线的速记与日记</title>
 <link rel="icon" type="image/png" href="https://ys-d.ysepan.com/wap/yangrenhyx/Midl9F9jH7C5b99/xc6gA7Jq4jBfFPab4s3jcge3gD1ke3/%E6%97%A0%E6%A0%87%E9%A2%98.png">
<script src="https://cdn.jsdelivr.net/npm/html-docx-js/dist/html-docx.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root {
    --primary: #3b4cca;
    --primary-hover: #2a38a8;
    --primary-light: #e8e8ff;
    --primary-border: #c5caf0;
    --bg: #f5f6f8;
    --paper: #ffffff;
    --text: #1a202c;
    --text-secondary: #4a5568;
    --muted: #718096;
    --border: #e0e0e0;
    --hover: #f0f0f5;
    --danger: #c53030;
    --success: #2f855a;
    --shadow-md: 0 2px 8px rgba(59, 76, 202, 0.08);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    height: 100%;
    font-family: "Segoe UI", -apple-system, "Microsoft YaHei", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    font-size: 14px;
}

body { display: flex; flex-direction: column; }

/* ==================== 顶部栏（完全采用 NORword 风格） ==================== */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 48px;
    padding: 0 24px;
    border-bottom: 1px solid #e0e0e0;
    background: #fff;
    flex-shrink: 0;
}

.logo-text {
    font-size: 18px;
    font-weight: 900;
    color: #3b4cca;
}

.nav-links {
    display: flex;
    gap: 24px;
    align-items: center;
}

.nav-links a {
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    color: #333;
    transition: opacity 0.2s;
    white-space: nowrap;
}

.nav-links a:hover {
    opacity: 0.7;
}

/* ==================== 主区 ==================== */
.main-area {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
}

.sidebar {
    width: 320px;
    background: var(--paper);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: transform 0.25s ease;
}

.sidebar-header {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}

.sidebar-title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.sidebar-title {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 700;
    letter-spacing: 0.5px;
}

.entry-count {
    font-size: 11px;
    background: var(--primary-light);
    color: var(--primary);
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
}

.search-box { position: relative; }

.search-box input {
    width: 100%;
    height: 34px;
    padding: 0 12px 0 34px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: all 0.15s;
}

.search-box input:focus {
    border-color: var(--primary-border);
    background: var(--paper);
    box-shadow: 0 0 0 3px var(--primary-light);
}

.search-icon {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    color: var(--muted);
    pointer-events: none;
}

.entry-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
}

.entry-item {
    display: flex;
    padding: 12px 12px 12px 0;
    margin-bottom: 2px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.12s;
    position: relative;
}

.entry-item:hover { background: var(--hover); }
.entry-item.active { background: var(--primary-light); }

.entry-bar {
    width: 3px;
    border-radius: 2px;
    margin-right: 12px;
    flex-shrink: 0;
}

.entry-bar.note { background: #a0aec0; }
.entry-bar.diary { background: var(--primary); }

.entry-main { flex: 1; min-width: 0; }

.entry-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
}

.entry-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
}

.entry-date {
    font-size: 11px;
    color: var(--muted);
    flex-shrink: 0;
}

.entry-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
}

.entry-preview {
    font-size: 12px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    line-height: 1.5;
}

.entry-tag {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 3px;
    flex-shrink: 0;
    letter-spacing: 0.3px;
}

.entry-tag.note { background: #edf2f7; color: #718096; }
.entry-tag.diary { background: var(--primary-light); color: var(--primary); }

.entry-mood {
    font-size: 14px;
    flex-shrink: 0;
    margin-left: 4px;
}

.entry-list-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.8;
}

.editor-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
}

.empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
    padding: 40px;
    text-align: center;
}

.empty-state-icon { font-size: 56px; opacity: 0.3; margin-bottom: 8px; }

.empty-state-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-secondary);
}

.empty-state-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.8;
    margin-bottom: 12px;
}

.empty-state-actions {
    display: flex;
    gap: 10px;
    margin-top: 4px;
}

.format-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    padding: 8px 20px;
    background: var(--paper);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}

.toolbar-group {
    display: flex;
    align-items: center;
    gap: 2px;
    padding-right: 10px;
    margin-right: 6px;
    border-right: 1px solid var(--border);
}

.toolbar-group:last-child {
    border-right: none;
    margin-right: 0;
    padding-right: 0;
}

.toolbar-btn {
    height: 30px;
    min-width: 30px;
    padding: 0 8px;
    font-size: 13px;
    font-family: inherit;
    border: 1px solid transparent;
    border-radius: 4px;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.12s;
    white-space: nowrap;
    font-weight: 500;
}

.toolbar-btn:hover { background: var(--hover); color: var(--text); }

.toolbar-select {
    height: 30px;
    padding: 0 6px;
    font-family: inherit;
    font-size: 12px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--paper);
    color: var(--text-secondary);
    cursor: pointer;
    outline: none;
}

.toolbar-color {
    width: 30px;
    height: 30px;
    padding: 2px;
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    background: var(--paper);
}

.paper-wrapper {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.paper {
    width: 100%;
    max-width: 780px;
    background: var(--paper);
    border-radius: 6px;
    box-shadow: var(--shadow-md);
    padding: 48px 56px 64px;
    min-height: calc(100vh - 220px);
    position: relative;
    border: 1px solid var(--border);
}

.paper-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 16px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 12px;
}

.meta-left {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

.meta-type {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 3px;
    letter-spacing: 0.5px;
}

.meta-type.note { background: #edf2f7; color: #718096; }
.meta-type.diary { background: var(--primary-light); color: var(--primary); }

.meta-date { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
.meta-time { font-size: 12px; color: var(--muted); }

.mood-picker {
    display: flex;
    gap: 4px;
    align-items: center;
}

.mood-label {
    font-size: 12px;
    color: var(--muted);
    margin-right: 4px;
}

.mood-btn {
    width: 32px;
    height: 32px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    filter: grayscale(0.6);
    opacity: 0.55;
}

.mood-btn:hover {
    background: var(--hover);
    filter: grayscale(0);
    opacity: 1;
    transform: scale(1.05);
}

.mood-btn.active {
    background: var(--primary-light);
    border-color: var(--primary-border);
    filter: grayscale(0);
    opacity: 1;
}

.paper-title {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
    padding: 4px 0 12px;
    line-height: 1.4;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s;
}

.paper-title:focus { border-bottom-color: var(--border); }

.paper-title::placeholder {
    color: var(--muted);
    opacity: 0.6;
    font-weight: 400;
}

.paper-content {
    outline: none;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.9;
    color: var(--text);
    padding: 16px 0;
    min-height: 400px;
    word-wrap: break-word;
}

.paper-content:empty::before {
    content: attr(data-placeholder);
    color: var(--muted);
    opacity: 0.5;
    pointer-events: none;
    display: block;
}

.paper-content p { margin: 8px 0; }
.paper-content h1 { font-size: 22px; margin: 16px 0 8px; }
.paper-content h2 { font-size: 18px; margin: 14px 0 6px; }
.paper-content h3 { font-size: 16px; margin: 12px 0 4px; }
.paper-content img { max-width: 100%; border-radius: 4px; margin: 8px 0; }
.paper-content table { border-collapse: collapse; width: 100%; margin: 10px 0; }
.paper-content table td { border: 1px solid var(--border); padding: 8px; }
.paper-content ul, .paper-content ol { padding-left: 24px; margin: 8px 0; }

/* ==================== 底部状态栏 + 文件操作 ==================== */
.status-bar {
    height: 34px;
    padding: 0 12px 0 16px;
    background: var(--paper);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--muted);
    flex-shrink: 0;
    gap: 12px;
}

.status-left {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
    min-width: 0;
}

.status-save {
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
}

.status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
    transition: background 0.2s;
    flex-shrink: 0;
}

.status-dot.saving { background: #d69e2e; }
.status-dot.error { background: var(--danger); }

.status-chars { white-space: nowrap; }
.status-updated { white-space: nowrap; color: #a0aec0; }

.file-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
}

.file-btn {
    height: 24px;
    padding: 0 10px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    white-space: nowrap;
    outline: none;
    border: 1px solid transparent;
    background: transparent;
    color: #4a5568;
}

.file-btn:hover {
    background: #f0f0f5;
    color: #1a202c;
}

.file-btn.primary {
    background: #3b4cca;
    color: #fff;
    border-color: #3b4cca;
    box-shadow: 0 1px 2px rgba(59, 76, 202, 0.25);
}

.file-btn.primary:hover {
    background: #2a38a8;
    border-color: #2a38a8;
}

.file-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.file-btn-divider {
    width: 1px;
    height: 14px;
    background: var(--border);
    margin: 0 4px;
}

.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26, 32, 44, 0.4);
    z-index: 90;
    opacity: 0;
    transition: opacity 0.25s;
}

.overlay.show { display: block; opacity: 1; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #a0aec0; }

/* ==================== 响应式 ==================== */
@media (max-width: 768px) {
    .navbar {
        flex-direction: column;
        height: auto;
        padding: 8px 12px;
        gap: 6px;
        position: relative;
    }

    .logo-text { font-size: 16px; }

    .nav-links { gap: 16px; flex-wrap: wrap; justify-content: center; }
    .nav-links a { font-size: 13px; }

    .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 34px;
        width: 85%;
        max-width: 320px;
        z-index: 95;
        transform: translateX(-100%);
        box-shadow: 4px 0 16px rgba(0, 0, 0, 0.12);
    }

    .sidebar.open { transform: translateX(0); }

    .format-toolbar {
        padding: 6px 10px;
        overflow-x: auto;
        flex-wrap: nowrap;
    }

    .toolbar-group {
        flex-shrink: 0;
        padding-right: 6px;
        margin-right: 2px;
    }

    .toolbar-btn { height: 28px; min-width: 28px; font-size: 12px; padding: 0 6px; }
    .toolbar-select { height: 28px; font-size: 11px; }
    .toolbar-color { width: 28px; height: 28px; }

    .paper-wrapper { padding: 12px; }

    .paper {
        padding: 28px 22px 40px;
        border-radius: 4px;
        min-height: calc(100vh - 180px);
    }

    .paper-meta {
        padding-bottom: 12px;
        margin-bottom: 12px;
        gap: 8px;
    }

    .meta-date { font-size: 12px; }
    .mood-btn { width: 28px; height: 28px; font-size: 16px; }
    .mood-label { display: none; }
    .paper-title { font-size: 18px; padding: 4px 0 8px; }

    .paper-content {
        font-size: 14px;
        line-height: 1.8;
        min-height: 300px;
    }

    .status-bar {
        height: 34px;
        padding: 0 8px;
        gap: 6px;
    }

    .status-left { gap: 8px; }
    .status-updated { display: none; }

    .file-actions { gap: 2px; }
    .file-btn { height: 24px; padding: 0 6px; font-size: 11px; }

    .empty-state-actions {
        flex-direction: column;
        width: 100%;
        max-width: 240px;
    }

    .empty-state-actions .btn {
        width: 100%;
        justify-content: center;
    }
}

@media (max-width: 480px) {
    .file-btn .btn-label { display: none; }
    .file-btn { padding: 0 6px; }
}
</style>
</head>
<body>

<!-- 顶部栏（无中间占位文字） -->
<header class="navbar">
    <span class="logo-text">Nortbook</span>
    <nav class="nav-links">
      <a href="https://nortbook.nor.asia/w">Word文档</a>
      <a href="https://nortbook.nor.asia/e">表格</a>
      <a href="https://nortbook.nor.asia/p">演示文稿</a>
      <a href="https://nortbook.nor.asia/">返回</a>
      <a href="https://nortbook.nor.asia/a">关于</a>
    </nav>
</header>

<!-- 主区 -->
<div class="main-area">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title-row">
                <span class="sidebar-title">全部条目</span>
                <span class="entry-count" id="entryCount">0</span>
            </div>
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="搜索标题或内容…">
            </div>
        </div>
        <div class="entry-list" id="entryList">
            <div class="entry-list-empty">暂无条目<br>点击底部按钮开始</div>
        </div>
    </aside>

    <div class="editor-main">
        <div class="empty-state" id="emptyState">
            <div class="empty-state-icon">📋</div>
            <div class="empty-state-title">选择或新建一个条目</div>
            <div class="empty-state-desc">
                <strong>速记</strong>：随手记录想法，无需分类<br>
                <strong>日记</strong>：记录每日心情与经历
            </div>
            <div class="empty-state-actions">
                <button class="btn btn-secondary" id="emptyNewNoteBtn" style="height:34px;padding:0 16px;border-radius:4px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #e0e0e0;background:#fff;color:#333;">+ 新建速记</button>
                <button class="btn btn-primary" id="emptyNewDiaryBtn" style="height:34px;padding:0 16px;border-radius:4px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #3b4cca;background:#3b4cca;color:#fff;">+ 新建日记</button>
            </div>
        </div>

        <div id="editorPanel" style="display: none; flex-direction: column; flex: 1; overflow: hidden;">
            <div class="format-toolbar">
                <div class="toolbar-group">
                    <button class="toolbar-btn" id="undoBtn" title="撤销">↶</button>
                    <button class="toolbar-btn" id="redoBtn" title="重做">↷</button>
                </div>
                <div class="toolbar-group">
                    <select class="toolbar-select" id="fontSizeSelect" title="字号">
                        <option value="13px">小</option>
                        <option value="15px" selected>标准</option>
                        <option value="17px">大</option>
                        <option value="20px">特大</option>
                    </select>
                </div>
                <div class="toolbar-group">
                    <button class="toolbar-btn" id="boldBtn" title="加粗"><b>B</b></button>
                    <button class="toolbar-btn" id="italicBtn" title="斜体"><i>I</i></button>
                    <button class="toolbar-btn" id="underlineBtn" title="下划线"><u>U</u></button>
                    <button class="toolbar-btn" id="strikeBtn" title="删除线"><s>S</s></button>
                </div>
                <div class="toolbar-group">
                    <input type="color" class="toolbar-color" id="textColor" value="#1a202c" title="文字颜色">
                    <input type="color" class="toolbar-color" id="bgColor" value="#fff3a3" title="高亮背景">
                </div>
                <div class="toolbar-group">
                    <button class="toolbar-btn" id="insertImageBtn" title="插入图片">图片</button>
                    <button class="toolbar-btn" id="exportOneBtn" title="导出本篇为 .docx">导出本篇</button>
                    <button class="toolbar-btn" id="deleteBtn" title="删除此条目" style="color: var(--danger);">删除</button>
                </div>
            </div>

            <div class="paper-wrapper">
                <div class="paper">
                    <div class="paper-meta">
                        <div class="meta-left">
                            <span class="meta-type" id="metaType">速记</span>
                            <span class="meta-date" id="metaDate">2026年10月17日</span>
                            <span class="meta-time" id="metaTime">14:30</span>
                        </div>
                        <div class="mood-picker" id="moodPicker" style="display: none;">
                            <span class="mood-label">心情：</span>
                            <button class="mood-btn" data-mood="happy" title="开心">😊</button>
                            <button class="mood-btn" data-mood="calm" title="平静">😌</button>
                            <button class="mood-btn" data-mood="sad" title="低落">😔</button>
                            <button class="mood-btn" data-mood="tired" title="疲惫">😴</button>
                            <button class="mood-btn" data-mood="angry" title="生气">😤</button>
                        </div>
                    </div>

                    <input type="text" class="paper-title" id="entryTitle" placeholder="标题…">

                    <div class="paper-content" id="entryContent" contenteditable="true" data-placeholder="开始输入…"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 底部状态栏 + 文件操作 -->
<footer class="status-bar">
    <div class="status-left">
        <div class="status-save">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusSave">就绪</span>
        </div>
        <span class="status-chars" id="statusChars">0 字</span>
        <span class="status-updated" id="statusUpdated"></span>
    </div>

    <div class="file-actions">
        <button class="file-btn" id="newNoteBtn" title="新建速记">
            <span>+ 速记</span>
        </button>
        <button class="file-btn" id="newDiaryBtn" title="新建日记">
            <span>+ 日记</span>
        </button>
        <div class="file-btn-divider"></div>
        <button class="file-btn" id="importBtn" title="导入备份">
            <span class="btn-label">导入</span>
        </button>
        <button class="file-btn primary" id="saveAllBtn" title="保存全部到电脑">
            <span>保存</span>
        </button>
    </div>
</footer>

<div class="overlay" id="overlay"></div>
<input type="file" id="imageInput" accept="image/*" style="display: none;">
<input type="file" id="importFileInput" accept=".zip,.json" style="display: none;">

<script>
(function() {
    'use strict';

    var ENTRIES_KEY = 'nortbook_entries_v2';
    var MOODS = {
        happy: { emoji: '😊', name: '开心' },
        calm:  { emoji: '😌', name: '平静' },
        sad:   { emoji: '😔', name: '低落' },
        tired: { emoji: '😴', name: '疲惫' },
        angry: { emoji: '😤', name: '生气' }
    };
    var WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

    var entries = [];
    var currentId = null;
    var saveTimer = null;
    var savedRange = null;

    function isMobile() { return window.innerWidth <= 768; }

    var $ = function(id) { return document.getElementById(id); };
    var sidebar = $('sidebar');
    var overlay = $('overlay');
    var entryList = $('entryList');
    var entryCount = $('entryCount');
    var searchInput = $('searchInput');
    var emptyState = $('emptyState');
    var editorPanel = $('editorPanel');
    var entryTitle = $('entryTitle');
    var entryContent = $('entryContent');
    var metaType = $('metaType');
    var metaDate = $('metaDate');
    var metaTime = $('metaTime');
    var moodPicker = $('moodPicker');
    var statusSave = $('statusSave');
    var statusDot = $('statusDot');
    var statusChars = $('statusChars');
    var statusUpdated = $('statusUpdated');
    var imageInput = $('imageInput');
    var importFileInput = $('importFileInput');
    var saveAllBtn = $('saveAllBtn');

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>"']/g, function(c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    function pad2(n) { return n < 10 ? '0' + n : '' + n; }

    function formatDateISO(d) {
        return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    }

    function formatDateCN(d) {
        return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
    }

    function formatDateShort(d) {
        return (d.getMonth() + 1) + '-' + pad2(d.getDate());
    }

    function formatTime(d) {
        return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    }

    function stripHtml(html) {
        var tmp = document.createElement('div');
        tmp.innerHTML = html || '';
        return (tmp.textContent || tmp.innerText || '').replace(/\s+/g, ' ').trim();
    }

    function genId() {
        return 'e_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    }

    function safeFilename(s) {
        return (s || '').replace(/[\/\\:*?"<>|]/g, '-').trim();
    }

    function loadEntries() {
        try {
            var raw = localStorage.getItem(ENTRIES_KEY);
            if (raw) {
                entries = JSON.parse(raw);
                if (!Array.isArray(entries)) entries = [];
            }
        } catch (e) {
            entries = [];
        }
    }

    function saveEntries() {
        try {
            localStorage.setItem(ENTRIES_KEY, JSON.stringify(entries));
            return true;
        } catch (e) {
            return false;
        }
    }

    function getEntry(id) {
        for (var i = 0; i < entries.length; i++) {
            if (entries[i].id === id) return entries[i];
        }
        return null;
    }

    function getCurrentEntry() { return getEntry(currentId); }

    function syncCurrentEntry() {
        var e = getCurrentEntry();
        if (!e) return;
        e.title = entryTitle.value.trim();
        e.content = entryContent.innerHTML;
        e.updated = Date.now();
    }

    function autoSave(showStatus) {
        if (!currentId) return;
        syncCurrentEntry();
        if (saveTimer) clearTimeout(saveTimer);

        if (showStatus !== false) {
            statusSave.textContent = '保存中…';
            statusDot.className = 'status-dot saving';
        }

        saveTimer = setTimeout(function() {
            var ok = saveEntries();
            if (showStatus !== false) {
                if (ok) {
                    statusSave.textContent = '已保存 ' + formatTime(new Date());
                    statusDot.className = 'status-dot';
                } else {
                    statusSave.textContent = '保存失败';
                    statusDot.className = 'status-dot error';
                }
            }
            updateEntryList();
            updateStatusBar();
        }, 400);
    }

    function updateStatusBar() {
        var text = stripHtml(entryContent.innerHTML);
        var chars = text.replace(/\s/g, '').length;
        statusChars.textContent = chars + ' 字';

        var e = getCurrentEntry();
        if (e && e.updated) {
            var d = new Date(e.updated);
            statusUpdated.textContent = '更新于 ' + formatDateShort(d) + ' ' + formatTime(d);
        } else {
            statusUpdated.textContent = '';
        }
    }

    function updateEntryList() {
        var keyword = (searchInput.value || '').trim().toLowerCase();
        var filtered = entries.slice();
        filtered.sort(function(a, b) { return (b.date || 0) - (a.date || 0); });

        if (keyword) {
            filtered = filtered.filter(function(e) {
                var inTitle = (e.title || '').toLowerCase().indexOf(keyword) !== -1;
                var inContent = stripHtml(e.content).toLowerCase().indexOf(keyword) !== -1;
                return inTitle || inContent;
            });
        }

        entryCount.textContent = entries.length;

        if (filtered.length === 0) {
            if (keyword) {
                entryList.innerHTML = '<div class="entry-list-empty">没有匹配的条目</div>';
            } else {
                entryList.innerHTML = '<div class="entry-list-empty">暂无条目<br>点击底部按钮开始</div>';
            }
            return;
        }

        var html = '';
        filtered.forEach(function(e) {
            var date = new Date(e.date);
            var isDiary = e.type === 'diary';
            var title = e.title || (isDiary ? formatDateCN(date) : '无标题速记');
            var preview = stripHtml(e.content).slice(0, 30);
            if (!preview) preview = '（暂无内容）';
            var moodEmoji = isDiary && e.mood && MOODS[e.mood] ? MOODS[e.mood].emoji : '';
            var tagClass = isDiary ? 'diary' : 'note';
            var tagText = isDiary ? '日记' : '速记';

            html += '<div class="entry-item' + (e.id === currentId ? ' active' : '') + '" data-id="' + e.id + '">';
            html += '  <div class="entry-bar ' + tagClass + '"></div>';
            html += '  <div class="entry-main">';
            html += '    <div class="entry-top">';
            html += '      <div class="entry-title">' + escapeHtml(title) + '</div>';
            html += '      <div class="entry-date">' + formatDateShort(date) + '</div>';
            html += '    </div>';
            html += '    <div class="entry-bottom">';
            html += '      <div class="entry-preview">' + escapeHtml(preview) + '</div>';
            html += '      <span class="entry-tag ' + tagClass + '">' + tagText + '</span>';
            if (moodEmoji) html += '      <span class="entry-mood">' + moodEmoji + '</span>';
            html += '    </div>';
            html += '  </div>';
            html += '</div>';
        });
        entryList.innerHTML = html;

        entryList.querySelectorAll('.entry-item').forEach(function(el) {
            el.addEventListener('click', function() {
                openEntry(this.getAttribute('data-id'));
                closeSidebarOnMobile();
            });
        });
    }

    function openEntry(id) {
        if (currentId && currentId !== id) {
            syncCurrentEntry();
            saveEntries();
        }

        var e = getEntry(id);
        if (!e) { showEmpty(); return; }

        currentId = id;

        emptyState.style.display = 'none';
        editorPanel.style.display = 'flex';

        var d = new Date(e.date);
        var isDiary = e.type === 'diary';

        metaType.textContent = isDiary ? '日记' : '速记';
        metaType.className = 'meta-type ' + (isDiary ? 'diary' : 'note');
        metaDate.textContent = formatDateCN(d) + (isDiary ? ' ' + WEEKDAYS[d.getDay()] : '');
        metaTime.textContent = formatTime(d);

        if (isDiary) {
            moodPicker.style.display = 'flex';
            moodPicker.querySelectorAll('.mood-btn').forEach(function(btn) {
                btn.classList.toggle('active', btn.getAttribute('data-mood') === e.mood);
            });
        } else {
            moodPicker.style.display = 'none';
        }

        entryTitle.placeholder = isDiary ? '给今天起个标题…' : '速记标题（可选）…';
        entryTitle.value = e.title || '';
        entryContent.innerHTML = e.content || '';

        updateStatusBar();
        updateEntryList();

        var wrapper = document.querySelector('.paper-wrapper');
        if (wrapper) wrapper.scrollTop = 0;
    }

    function showEmpty() {
        currentId = null;
        emptyState.style.display = 'flex';
        editorPanel.style.display = 'none';
        updateEntryList();
        statusChars.textContent = '0 字';
        statusUpdated.textContent = '';
    }

    function createEntry(type) {
        if (currentId) {
            syncCurrentEntry();
            saveEntries();
        }

        var now = new Date();
        var newEntry = {
            id: genId(),
            type: type,
            title: '',
            content: '',
            date: now.getTime(),
            mood: type === 'diary' ? 'happy' : '',
            updated: now.getTime()
        };

        entries.unshift(newEntry);
        currentId = newEntry.id;
        saveEntries();

        openEntry(newEntry.id);
        closeSidebarOnMobile();

        setTimeout(function() { entryTitle.focus(); }, 100);
        statusSave.textContent = '已新建';
        statusDot.className = 'status-dot';
    }

    function deleteCurrentEntry() {
        if (!currentId) return;
        var e = getCurrentEntry();
        if (!e) return;

        var isDiary = e.type === 'diary';
        var typeName = isDiary ? '日记' : '速记';
        var title = e.title || (isDiary ? formatDateCN(new Date(e.date)) : '无标题速记');

        if (!confirm('确定要删除' + typeName + '「' + title + '」吗？\n此操作不可恢复。')) {
            return;
        }

        var idx = entries.findIndex(function(x) { return x.id === currentId; });
        if (idx > -1) entries.splice(idx, 1);

        currentId = null;
        saveEntries();

        if (entries.length > 0) {
            var sorted = entries.slice().sort(function(a, b) { return (b.date || 0) - (a.date || 0); });
            openEntry(sorted[0].id);
        } else {
            showEmpty();
        }
        statusSave.textContent = '已删除';
        statusDot.className = 'status-dot';
    }

    function openSidebar() {
        sidebar.classList.add('open');
        overlay.classList.add('show');
    }

    function closeSidebarOnMobile() {
        if (isMobile()) {
            sidebar.classList.remove('open');
            overlay.classList.remove('show');
        }
    }

    overlay.addEventListener('click', closeSidebarOnMobile);

    entryTitle.addEventListener('input', function() { autoSave(); });
    entryContent.addEventListener('input', function() { autoSave(); });

    moodPicker.querySelectorAll('.mood-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var mood = this.getAttribute('data-mood');
            var e = getCurrentEntry();
            if (!e || e.type !== 'diary') return;

            if (e.mood === mood) {
                e.mood = '';
            } else {
                e.mood = mood;
            }
            moodPicker.querySelectorAll('.mood-btn').forEach(function(b) {
                b.classList.toggle('active', b.getAttribute('data-mood') === e.mood);
            });
            autoSave();
        });
    });

    searchInput.addEventListener('input', updateEntryList);

    function saveSelection() {
        var sel = window.getSelection();
        if (sel.rangeCount) {
            try { savedRange = sel.getRangeAt(0).cloneRange(); } catch(e) {}
        }
    }

    function restoreSelection() {
        if (!savedRange) return false;
        try {
            var sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(savedRange);
            return true;
        } catch(e) { return false; }
    }

    document.querySelectorAll('.format-toolbar button, .format-toolbar select, .format-toolbar input').forEach(function(el) {
        el.addEventListener('mousedown', saveSelection);
        el.addEventListener('touchstart', saveSelection, { passive: true });
    });

    function execCmd(cmd, value) {
        restoreSelection();
        entryContent.focus();
        document.execCommand(cmd, false, value || null);
        autoSave();
    }

    $('boldBtn').addEventListener('click', function() { execCmd('bold'); });
    $('italicBtn').addEventListener('click', function() { execCmd('italic'); });
    $('underlineBtn').addEventListener('click', function() { execCmd('underline'); });
    $('strikeBtn').addEventListener('click', function() { execCmd('strikeThrough'); });
    $('undoBtn').addEventListener('click', function() { execCmd('undo'); });
    $('redoBtn').addEventListener('click', function() { execCmd('redo'); });

    $('fontSizeSelect').addEventListener('change', function() {
        var size = this.value;
        restoreSelection();
        var sel = window.getSelection();
        if (!sel.rangeCount) return;
        var range = sel.getRangeAt(0);

        if (range.collapsed) {
            var span = document.createElement('span');
            span.style.fontSize = size;
            span.appendChild(document.createTextNode('\u200B'));
            range.insertNode(span);
            var nr = document.createRange();
            nr.setStart(span.firstChild, 1);
            nr.collapse(true);
            sel.removeAllRanges();
            sel.addRange(nr);
        } else {
            try {
                document.execCommand('styleWithCSS', false, true);
                document.execCommand('fontSize', false, '7');
            } catch(e) {}

            entryContent.querySelectorAll('font[size="7"]').forEach(function(font) {
                var s = document.createElement('span');
                s.style.fontSize = size;
                while (font.firstChild) s.appendChild(font.firstChild);
                font.parentNode.replaceChild(s, font);
            });
            entryContent.querySelectorAll('span').forEach(function(sp) {
                var fs = sp.style.fontSize;
                if (fs === 'xxx-large' || fs === '48px' || fs === '7') {
                    sp.style.fontSize = size;
                }
            });
        }
        autoSave();
    });

    $('textColor').addEventListener('input', function() { execCmd('foreColor', this.value); });
    $('bgColor').addEventListener('input', function() { execCmd('hiliteColor', this.value); });

    $('insertImageBtn').addEventListener('click', function() { imageInput.click(); });
    imageInput.addEventListener('change', function(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(ev) {
            execCmd('insertHTML', '<img src="' + ev.target.result + '" alt="图片">');
        };
        reader.readAsDataURL(file);
        imageInput.value = '';
    });

    $('deleteBtn').addEventListener('click', deleteCurrentEntry);

    function buildFilename(e) {
        var d = new Date(e.date);
        var parts = [formatDateISO(d), e.type === 'diary' ? '日记' : '速记'];
        if (e.type === 'diary' && e.mood && MOODS[e.mood]) {
            parts.push(MOODS[e.mood].name);
        }
        return safeFilename(parts.join('_')) + '.docx';
    }

    function buildEntryDocxHtml(e) {
        var d = new Date(e.date);
        var isDiary = e.type === 'diary';
        var title = e.title || (isDiary ? formatDateCN(d) : '无标题速记');
        var typeName = isDiary ? '日记' : '速记';
        var moodEmoji = '';
        var moodName = '';
        if (isDiary && e.mood && MOODS[e.mood]) {
            moodEmoji = MOODS[e.mood].emoji;
            moodName = MOODS[e.mood].name;
        }
        var metaLine = formatDateCN(d);
        if (isDiary) metaLine += ' ' + WEEKDAYS[d.getDay()];
        if (moodEmoji) metaLine += ' · ' + moodEmoji + ' ' + moodName;

        return '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>'
            + 'body{font-family:"Microsoft YaHei","Segoe UI",Arial,sans-serif;font-size:14px;line-height:1.9;color:#1a202c;padding:40px;}'
            + 'h1{font-size:22px;font-weight:700;margin-bottom:12px;color:#1a202c;}'
            + '.meta{color:#718096;font-size:12px;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid #e2e8f0;}'
            + '.type-tag{display:inline-block;background:#e8e8ff;color:#3b4cca;padding:1px 8px;border-radius:3px;font-size:11px;font-weight:600;margin-right:8px;}'
            + 'img{max-width:100%;border-radius:4px;}'
            + 'table{border-collapse:collapse;width:100%;}'
            + 'td{border:1px solid #e2e8f0;padding:8px;}'
            + '</style></head><body>'
            + '<h1>' + escapeHtml(title) + '</h1>'
            + '<div class="meta"><span class="type-tag">' + typeName + '</span>' + metaLine + '</div>'
            + (e.content || '')
            + '</body></html>';
    }

    function buildEntryDocxBlob(e) {
        if (typeof htmlDocx === 'undefined') return null;
        try {
            return htmlDocx.asBlob(buildEntryDocxHtml(e), {
                orientation: 'portrait',
                margins: { top: 720, right: 720, bottom: 720, left: 720 }
            });
        } catch(err) {
            console.warn('生成文档失败', e.id, err);
            return null;
        }
    }

    function exportOne() {
        if (!currentId) return;
        syncCurrentEntry();
        var e = getCurrentEntry();
        if (!e) return;

        var blob = buildEntryDocxBlob(e);
        if (!blob) {
            alert('导出库未加载或生成失败');
            return;
        }

        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = buildFilename(e);
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function() { URL.revokeObjectURL(url); }, 1000);

        statusSave.textContent = '已导出本篇';
        statusDot.className = 'status-dot';
    }

    $('exportOneBtn').addEventListener('click', exportOne);

    async function exportAllAsZip() {
        if (entries.length === 0) {
            alert('还没有任何条目可以保存');
            return;
        }
        if (typeof JSZip === 'undefined') {
            alert('压缩库未加载，请稍后重试');
            return;
        }
        if (typeof htmlDocx === 'undefined') {
            alert('文档库未加载，请稍后重试');
            return;
        }

        if (currentId) syncCurrentEntry();
        saveEntries();

        statusSave.textContent = '正在打包…';
        statusDot.className = 'status-dot saving';
        saveAllBtn.disabled = true;

        try {
            var zip = new JSZip();
            var folderName = 'Nortbook_' + formatDateISO(new Date());
            var folder = zip.folder(folderName);

            folder.file('data.json', JSON.stringify({
                app: 'Nortbook',
                version: 1,
                exportedAt: Date.now(),
                entries: entries
            }, null, 2));

            var usedNames = {};
            entries.forEach(function(e, i) {
                var blob = buildEntryDocxBlob(e);
                if (!blob) return;

                var filename = buildFilename(e);
                if (usedNames[filename]) {
                    filename = filename.replace('.docx', '_' + (i + 1) + '.docx');
                }
                usedNames[filename] = true;

                folder.file(filename, blob);
            });

            var content = await zip.generateAsync({
                type: 'blob',
                compression: 'DEFLATE',
                compressionOptions: { level: 6 }
            });

            var url = URL.createObjectURL(content);
            var a = document.createElement('a');
            a.href = url;
            a.download = folderName + '.zip';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function() { URL.revokeObjectURL(url); }, 2000);

            statusSave.textContent = '已保存 ' + entries.length + ' 条';
            statusDot.className = 'status-dot';
        } catch (err) {
            console.error(err);
            alert('保存失败：' + err.message);
            statusSave.textContent = '保存失败';
            statusDot.className = 'status-dot error';
        } finally {
            saveAllBtn.disabled = false;
        }
    }

    saveAllBtn.addEventListener('click', exportAllAsZip);

    $('importBtn').addEventListener('click', function() { importFileInput.click(); });

    importFileInput.addEventListener('change', async function(e) {
        var file = e.target.files[0];
        if (!file) return;

        var name = (file.name || '').toLowerCase();
        statusSave.textContent = '正在导入…';
        statusDot.className = 'status-dot saving';

        try {
            if (name.endsWith('.json')) {
                var text = await readFileAsText(file);
                handleImportData(text);
            } else if (name.endsWith('.zip')) {
                if (typeof JSZip === 'undefined') {
                    alert('压缩库未加载');
                    return;
                }
                var zip = await JSZip.loadAsync(file);
                var dataFile = null;
                zip.forEach(function(path, entry) {
                    if (entry.name.endsWith('data.json') || entry.name === 'data.json') {
                        dataFile = entry;
                    }
                });
                if (!dataFile) {
                    alert('ZIP 中未找到 data.json 备份文件');
                    statusSave.textContent = '导入失败';
                    statusDot.className = 'status-dot error';
                    return;
                }
                var text2 = await dataFile.async('text');
                handleImportData(text2);
            } else {
                alert('仅支持 .zip 或 .json 文件');
                statusSave.textContent = '导入失败';
                statusDot.className = 'status-dot error';
            }
        } catch (err) {
            console.error(err);
            alert('导入失败：' + err.message);
            statusSave.textContent = '导入失败';
            statusDot.className = 'status-dot error';
        } finally {
            importFileInput.value = '';
        }
    });

    function readFileAsText(file) {
        return new Promise(function(resolve, reject) {
            var reader = new FileReader();
            reader.onload = function(ev) { resolve(ev.target.result); };
            reader.onerror = function() { reject(new Error('读取文件失败')); };
            reader.readAsText(file);
        });
    }

    function handleImportData(text) {
        var data;
        try {
            data = JSON.parse(text);
        } catch(err) {
            alert('备份文件格式不正确，无法解析');
            statusSave.textContent = '导入失败';
            statusDot.className = 'status-dot error';
            return;
        }

        var importedEntries = data.entries || (Array.isArray(data) ? data : null);
        if (!importedEntries || !Array.isArray(importedEntries)) {
            alert('备份中未找到有效的条目数据');
            statusSave.textContent = '导入失败';
            statusDot.className = 'status-dot error';
            return;
        }

        var validEntries = importedEntries.filter(function(e) {
            return e && e.id && e.type && e.date;
        });

        if (validEntries.length === 0) {
            alert('备份中没有可导入的有效条目');
            statusSave.textContent = '导入失败';
            statusDot.className = 'status-dot error';
            return;
        }

        var choice = confirm(
            '找到 ' + validEntries.length + ' 条记录。\n\n' +
            '点击「确定」= 合并到现有数据（按 ID 去重，现有条目不会被覆盖）\n' +
            '点击「取消」= 取消导入'
        );

        if (!choice) {
            statusSave.textContent = '已取消导入';
            statusDot.className = 'status-dot';
            return;
        }

        var existingIds = {};
        entries.forEach(function(e) { existingIds[e.id] = true; });

        var added = 0;
        validEntries.forEach(function(e) {
            if (!existingIds[e.id]) {
                entries.push(e);
                existingIds[e.id] = true;
                added++;
            }
        });

        saveEntries();
        updateEntryList();

        statusSave.textContent = '已导入 ' + added + ' 条';
        statusDot.className = 'status-dot';

        if (added > 0) {
            var sorted = entries.slice().sort(function(a, b) { return (b.date || 0) - (a.date || 0); });
            if (sorted.length > 0) openEntry(sorted[0].id);
        }
    }

    $('newNoteBtn').addEventListener('click', function() { createEntry('note'); });
    $('newDiaryBtn').addEventListener('click', function() { createEntry('diary'); });
    $('emptyNewNoteBtn').addEventListener('click', function() { createEntry('note'); });
    $('emptyNewDiaryBtn').addEventListener('click', function() { createEntry('diary'); });

    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey || e.metaKey) {
            if (e.key === 'n') { e.preventDefault(); createEntry('note'); }
            if (e.key === 'd') { e.preventDefault(); createEntry('diary'); }
            if (e.key === 's') { e.preventDefault(); exportAllAsZip(); }
            if (e.key === 'b' && document.activeElement === entryContent) { e.preventDefault(); execCmd('bold'); }
            if (e.key === 'i' && document.activeElement === entryContent) { e.preventDefault(); execCmd('italic'); }
            if (e.key === 'u' && document.activeElement === entryContent) { e.preventDefault(); execCmd('underline'); }
        }
        if (e.key === 'Escape') closeSidebarOnMobile();
    });

    window.addEventListener('beforeunload', function(e) {
        if (currentId) {
            syncCurrentEntry();
            saveEntries();
            e.preventDefault();
            e.returnValue = '内容已自动保存到浏览器，确定离开？';
            return e.returnValue;
        }
    });

    function init() {
        loadEntries();
        if (entries.length > 0) {
            var sorted = entries.slice().sort(function(a, b) { return (b.date || 0) - (a.date || 0); });
            openEntry(sorted[0].id);
        } else {
            showEmpty();
        }
        updateEntryList();
    }

    init();
})();
</script>
</body>
</html>
