<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nortbook Word - 免费网页在线编辑word文档</title>
    <link rel="icon" type="image/png" href="https://ys-d.ysepan.com/wap/yangrenhyx/Midl9F9jH7C5b99/xc6gA7Jq4jBfFPab4s3jcge3gD1ke3/%E6%97%A0%E6%A0%87%E9%A2%98.png">
    <script src="https://cdn.jsdelivr.net/npm/html-docx-js/dist/html-docx.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif; }
        body { display: flex; flex-direction: column; background: #f3f3f3; overflow: hidden; }

        .navbar { display: flex; justify-content: space-between; align-items: center; height: 48px; padding: 0 24px; border-bottom: 1px solid #e0e0e0; background: #fff; flex-shrink: 0; }
        .logo-text { font-size: 18px; font-weight: 900; color: #3b4cca; }
        .nav-links { display: flex; gap: 24px; }
        .nav-links a { text-decoration: none; font-size: 14px; font-weight: 600; color: #333; }

        .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 4px 12px; background: #fff; border-bottom: 1px solid #e0e0e0; flex-shrink: 0; min-height: 36px; position: relative; z-index: 50; }
        .toolbar-group { display: flex; align-items: center; gap: 2px; padding-right: 8px; margin-right: 4px; border-right: 1px solid #e0e0e0; position: relative; }
        .toolbar-group:last-child { border-right: none; }
        .toolbar button, .toolbar select { height: 28px; padding: 0 8px; font-size: 12px; font-family: inherit; border: 1px solid transparent; border-radius: 4px; background: transparent; cursor: pointer; color: #333; display: flex; align-items: center; justify-content: center; transition: background 0.15s; white-space: nowrap; }
        .toolbar button:hover, .toolbar select:hover { background: #f0f0f0; }
        .toolbar button.active { background: #d0d0ff; }
        .toolbar select { border: 1px solid #ccc; background: #fff; }
        .toolbar input[type="color"] { width: 28px; height: 28px; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; padding: 0; background: #fff; }

        .btn-primary { background-color: #3b4cca !important; color: #ffffff !important; border: none !important; font-weight: 600; padding: 0 12px !important; border-radius: 4px; }
        .btn-primary:hover { background-color: #2a38a8 !important; }

        .dropdown-arrow { font-size: 10px; margin-left: 3px; opacity: 0.7; }

        .dropdown-panel { display: none; position: absolute; top: 34px; left: 0; background: #fff; border: 1px solid #ccc; border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); padding: 8px; z-index: 100; min-width: 240px; }
        .dropdown-panel.show { display: block; }
        .dropdown-panel .panel-title { font-size: 11px; color: #888; margin-bottom: 6px; font-weight: 600; }
        .panel-list { display: flex; flex-direction: column; gap: 2px; }
        .panel-list button { padding: 8px 12px; font-size: 13px; text-align: left; border: none; background: transparent; border-radius: 4px; cursor: pointer; color: #333; display: flex; align-items: center; gap: 10px; }
        .panel-list button:hover { background: #f0f0f0; }

        .shape-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
        .shape-grid button { width: 32px; height: 32px; padding: 0; font-size: 16px; background: #fafafa; border: 1px solid #e0e0e0; border-radius: 4px; cursor: pointer; }
        .shape-grid button:hover { background: #d0d0ff; }

        .zoom-controls { display: flex; align-items: center; gap: 2px; }
        .zoom-controls button { padding: 0 8px; height: 28px; font-size: 12px; background: transparent; border: 1px solid transparent; border-radius: 4px; cursor: pointer; color: #333; }
        .zoom-controls button:hover { background: #f0f0f0; }
        .zoom-controls .zoom-display { font-size: 12px; width: 44px; text-align: center; color: #666; user-select: none; }

        .editor-wrapper { flex: 1; min-height: 0; overflow: auto; padding: 20px; background: #e8eaed; display: flex; justify-content: center; align-items: flex-start; }

        .pages-container { display: flex; flex-direction: column; align-items: center; gap: 20px; transform-origin: top center; transition: transform 0.2s ease; }

        .editor-page {
            width: 794px;
            height: 1123px;
            background: #fff;
            padding: 60px 70px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.12);
            outline: none;
            font-size: 15px;
            line-height: 1.8;
            color: #222;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .editor-page table { border-collapse: collapse; width: 100%; margin: 10px 0; }
        .editor-page table td { border: 1px solid #ccc; padding: 8px; min-width: 40px; }
        .editor-page hr { border: none; border-top: 2px solid #ccc; margin: 16px 0; }

        .editor-page h1 { font-size: 32px; font-weight: 800; margin: 18px 0 10px; line-height: 1.3; }
        .editor-page h2 { font-size: 26px; font-weight: 700; margin: 16px 0 8px; line-height: 1.3; }
        .editor-page h3 { font-size: 22px; font-weight: 700; margin: 14px 0 6px; line-height: 1.3; }
        .editor-page h4 { font-size: 18px; font-weight: 700; margin: 12px 0 6px; line-height: 1.3; }
        .editor-page p { margin: 6px 0; }

        .text-box { display: inline-block; border: 1px solid #999; padding: 8px 12px; min-width: 120px; min-height: 40px; background: #fafafa; position: relative; margin: 6px 0; border-radius: 2px; }
        .content-block { border: 1px solid #ccc; padding: 12px 16px; margin: 10px 0; background: #f9f9fc; border-radius: 4px; border-left: 4px solid #3b4cca; }
        .shape-rect { display: inline-block; width: 100px; height: 60px; border: 2px solid #3b4cca; background: #f0f0ff; margin: 6px; vertical-align: middle; }
        .shape-circle { display: inline-block; width: 80px; height: 80px; border-radius: 50%; border: 2px solid #3b4cca; background: #f0f0ff; margin: 6px; vertical-align: middle; }
        .shape-arrow { display: inline-block; width: 100px; height: 40px; border: 2px solid #3b4cca; background: #f0f0ff; clip-path: polygon(0 30%, 70% 30%, 70% 0, 100% 50%, 70% 100%, 70% 70%, 0 70%); margin: 6px; }
        .page-break { border-top: 3px dashed #ccc; margin: 24px 0; position: relative; }
        .tab-stop { display: inline-block; border-bottom: 1px dotted #999; }

        .status-bar { height: 28px; padding: 0 16px; background: #fff; border-top: 1px solid #e0e0e0; display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: #888; flex-shrink: 0; }

        @media (max-width: 768px) {
            .navbar { flex-direction: column; height: auto; padding: 8px 12px; gap: 6px; }
            .logo-text { font-size: 16px; }
            .nav-links { gap: 16px; }
            .nav-links a { font-size: 13px; }

            .toolbar { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 3px 8px; }
            .toolbar-group { padding-right: 4px; margin-right: 2px; flex-shrink: 0; }
            .toolbar button, .toolbar select { height: 26px; font-size: 11px; padding: 0 6px; }

            .editor-wrapper { padding: 8px; }
            .zoom-controls { display: none; }
            .pages-container { transform: none !important; width: 100%; max-width: 100%; gap: 12px; }

            .editor-page {
                width: 100%;
                max-width: 100%;
                height: auto;
                min-height: auto;
                padding: 20px 16px;
                overflow: visible;
            }

            .editor-page h1 { font-size: 24px; }
            .editor-page h2 { font-size: 20px; }
            .editor-page h3 { font-size: 18px; }
            .editor-page h4 { font-size: 16px; }
            .editor-page p { margin: 4px 0; }

            .status-bar { font-size: 10px; padding: 3px 8px; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <span class="logo-text">Nortbook</span>
        <nav class="nav-links">
            <a href="https://nortbook.nor.asia/nortbook">NT速记</a>
            <a href="https://nortbook.nor.asia/e">表格</a>
            <a href="https://nortbook.nor.asia/p">演示文稿</a>
            <a href="https://nortbook.nor.asia/">返回</a>
            <a href="https://nortbook.nor.asia/a">关于</a>
        </nav>
    </header>

    <div class="toolbar" id="toolbar">
        <div class="toolbar-group">
            <button id="importBtn" class="btn-primary" title="导入 .docx">导入</button>
            <button id="saveBtn" class="btn-primary" title="下载为 .docx">保存</button>
        </div>

        <div class="toolbar-group">
            <button id="undoBtn" title="撤销 (Ctrl+Z)">撤销</button>
            <button id="redoBtn" title="重做 (Ctrl+Y)">重做</button>
            <button id="clearFormat" title="清除格式">清除格式</button>
        </div>

        <div class="toolbar-group">
            <select id="fontFamily" title="字体">
                <option value="Segoe UI">Segoe UI</option>
                <option value="Microsoft YaHei">微软雅黑</option>
                <option value="SimSun">宋体</option>
                <option value="SimHei">黑体</option>
                <option value="KaiTi">楷体</option>
                <option value="Arial">Arial</option>
                <option value="Times New Roman">Times New Roman</option>
            </select>
            <select id="fontSize" title="字号">
                <option value="12px">12</option>
                <option value="14px">14</option>
                <option value="15px" selected>15</option>
                <option value="16px">16</option>
                <option value="18px">18</option>
                <option value="20px">20</option>
                <option value="24px">24</option>
                <option value="28px">28</option>
                <option value="36px">36</option>
            </select>
        </div>

        <div class="toolbar-group">
            <button id="boldBtn" title="加粗 (Ctrl+B)"><b>B</b></button>
            <button id="italicBtn" title="斜体 (Ctrl+I)"><i>I</i></button>
            <button id="underlineBtn" title="下划线 (Ctrl+U)"><u>U</u></button>
            <button id="strikeBtn" title="删除线"><s>S</s></button>
        </div>

        <div class="toolbar-group">
            <input type="color" id="textColor" value="#000000" title="字体颜色">
            <input type="color" id="bgColor" value="#ffff00" title="背景高亮">
            <select id="styleSelect" title="段落样式">
                <option value="p">正文</option>
                <option value="h1">标题 1</option>
                <option value="h2">标题 2</option>
                <option value="h3">标题 3</option>
                <option value="h4">标题 4</option>
            </select>
            <select id="lineHeight" title="行距">
                <option value="1.0">1.0</option>
                <option value="1.2">1.2</option>
                <option value="1.5" selected>1.5</option>
                <option value="1.8">1.8</option>
                <option value="2.0">2.0</option>
                <option value="2.5">2.5</option>
                <option value="3.0">3.0</option>
            </select>
        </div>

        <div class="toolbar-group">
            <button id="insertMenuBtn" title="插入">插入<span class="dropdown-arrow">▾</span></button>
            <div class="dropdown-panel" id="insertMenuPanel" style="min-width: 260px;">
                <div class="panel-title">插入</div>
                <div class="panel-list">
                    <button id="insertLink">链接</button>
                    <button id="insertImage">图片</button>
                    <button id="insertTable">表格</button>
                    <button id="insertTextBox">文本框</button>
                    <button id="insertBlock">内容块</button>
                    <button id="insertShape">形状</button>
                    <button id="insertPageBreak">新页</button>
                    <button id="tabStopBtn">制表位</button>
                    <button id="insertHr">水平线</button>
                </div>
                <div class="panel-title" style="margin-top:6px;">形状</div>
                <div class="shape-grid">
                    <button data-shape="rect" title="矩形">▭</button>
                    <button data-shape="circle" title="圆形">◯</button>
                    <button data-shape="arrow" title="箭头">➔</button>
                </div>
            </div>
        </div>

        <div class="toolbar-group">
            <button id="symbolMenuBtn" title="符号与公式">公式<span class="dropdown-arrow">▾</span></button>
            <div class="dropdown-panel" id="symbolMenuPanel" style="min-width: 360px;">
                <div class="panel-title">输入 LaTeX 公式</div>
                <div style="display:flex;gap:6px;margin-bottom:8px;">
                    <input type="text" id="formulaInput" style="flex:1;padding:5px 8px;font-size:12px;border:1px solid #ccc;border-radius:4px;font-family:monospace;" placeholder="例如：E=mc^2">
                    <button id="formulaInsertBtn" style="padding:5px 10px;background:#3b4cca;color:#fff;border:none;border-radius:4px;cursor:pointer;">插入</button>
                </div>
                <div class="panel-title">常用公式</div>
                <div id="formulaList" style="display:flex;flex-direction:column;gap:4px;max-height:180px;overflow-y:auto;"></div>
                <div class="panel-title" style="margin-top:8px;">数学符号</div>
                <div class="shape-grid" id="symbolGrid"></div>
                <div class="panel-title" style="margin-top:8px;">特殊字符</div>
                <div class="shape-grid" id="specialGrid"></div>
            </div>
        </div>

        <div class="toolbar-group">
            <button id="findMenuBtn" title="查找与替换">查找<span class="dropdown-arrow">▾</span></button>
            <button id="formatPainterBtn" title="格式刷">格式刷</button>
            <div class="dropdown-panel" id="findMenuPanel" style="min-width: 280px;">
                <div style="display:flex;gap:6px;margin-bottom:6px;"><input type="text" id="findText" placeholder="查找内容..." style="flex:1;padding:5px 8px;font-size:12px;border:1px solid #ccc;border-radius:4px;"></div>
                <div style="display:flex;gap:6px;margin-bottom:6px;"><input type="text" id="replaceText" placeholder="替换为..." style="flex:1;padding:5px 8px;font-size:12px;border:1px solid #ccc;border-radius:4px;"></div>
                <div style="display:flex;gap:6px;">
                    <button id="findNextBtn" style="padding:5px 10px;font-size:12px;background:#3b4cca;color:#fff;border:none;border-radius:4px;cursor:pointer;">查找下一个</button>
                    <button id="replaceBtn" style="padding:5px 10px;font-size:12px;background:#3b4cca;color:#fff;border:none;border-radius:4px;cursor:pointer;">替换</button>
                    <button id="replaceAllBtn" style="padding:5px 10px;font-size:12px;background:#3b4cca;color:#fff;border:none;border-radius:4px;cursor:pointer;">全部替换</button>
                </div>
            </div>
        </div>

        <div class="toolbar-group">
            <div class="zoom-controls">
                <button id="zoomOut" title="缩小">-</button>
                <span class="zoom-display" id="zoomDisplay">100%</span>
                <button id="zoomIn" title="放大">+</button>
                <button id="zoomReset" title="重置为100%" style="font-size:11px;">重置</button>
            </div>
        </div>
    </div>

    <div class="editor-wrapper">
        <div class="pages-container" id="pagesContainer">
            <div class="editor-page" id="page1" contenteditable="true"></div>
        </div>
    </div>

    <div class="status-bar">
        <span id="wordCount">字符数：0 | 行数：1 | 页数：1</span>
        <span id="saveStatus">已保存</span>
    </div>

    <input type="file" id="fileInput" accept=".docx" style="display: none;" />

    <script>
    (function() {
        var pagesContainer = document.getElementById('pagesContainer');
        var status = document.getElementById('wordCount');
        var saveStatus = document.getElementById('saveStatus');
        var STORAGE_KEY = 'nortbook_word_content';
        var saveTimer = null;
        var isHandlingUnload = false;
        var currentZoom = 1.0;
        var MAX_CHARS_PER_PAGE = 1500;
        var savedRange = null;

        function isMobile() { return window.innerWidth <= 768; }

        // ============ 从缓存恢复 ============
        try {
            var saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                var parts = saved.split('<!--PAGE_BREAK-->');
                var page1 = document.getElementById('page1');
                page1.innerHTML = parts[0] || '';
                for (var i = 1; i < parts.length; i++) {
                    var np = document.createElement('div');
                    np.className = 'editor-page';
                    np.setAttribute('contenteditable', 'true');
                    np.innerHTML = parts[i];
                    pagesContainer.appendChild(np);
                    bindPageEvents(np);
                }
            }
        } catch(e) {}

        // ============ 页面管理 ============
        function getAllPages() { return Array.from(document.querySelectorAll('.editor-page')); }

        function createNewPage() {
            var newPage = document.createElement('div');
            newPage.className = 'editor-page';
            newPage.setAttribute('contenteditable', 'true');
            pagesContainer.appendChild(newPage);
            bindPageEvents(newPage);
            return newPage;
        }

        function bindPageEvents(page) {
            page.addEventListener('input', function() {
                autoSave();
                updateCount();
                isHandlingUnload = false;
                if (!isMobile()) scheduleLengthCheck();
            });
        }
        bindPageEvents(document.getElementById('page1'));

        // ============ 选区保存/恢复 ============
        function saveCurrentSelection() {
            var sel = window.getSelection();
            if (sel.rangeCount) {
                try { savedRange = sel.getRangeAt(0).cloneRange(); } catch(e) {}
            }
        }
        function restoreCurrentSelection() {
            if (!savedRange) return false;
            try {
                var sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(savedRange);
                return true;
            } catch(e) { return false; }
        }

        // ============ 在工具栏控件上保存选区 ============
        // 所有 toolbar 的按钮、select、color 输入框在 mousedown / touchstart 时保存选区
        document.querySelectorAll('.toolbar button, .toolbar select, .toolbar input[type="color"]').forEach(function(el) {
            el.addEventListener('mousedown', saveCurrentSelection);
            el.addEventListener('touchstart', saveCurrentSelection, { passive: true });
        });

        // ============ 设置字号（核心修复） ============
        function setFontSize(size) {
            // 恢复选区
            restoreCurrentSelection();
            var sel = window.getSelection();
            if (!sel.rangeCount) return;
            var range = sel.getRangeAt(0);

            if (range.collapsed) {
                // 折叠选区：在光标处插入一个带字号的占位 span
                var span = document.createElement('span');
                span.style.fontSize = size;
                span.appendChild(document.createTextNode('\u200B'));
                range.insertNode(span);
                var newRange = document.createRange();
                newRange.setStart(span.firstChild, 1);
                newRange.collapse(true);
                sel.removeAllRanges();
                sel.addRange(newRange);
            } else {
                // 非折叠选区：execCommand 占位字号 + 替换为 span
                try {
                    document.execCommand('styleWithCSS', false, true);
                    document.execCommand('fontSize', false, '7');
                } catch(e) {}

                // 找到当前活动页
                var node = range.commonAncestorContainer;
                if (node.nodeType === 3) node = node.parentElement;
                while (node && !node.classList.contains('editor-page')) {
                    node = node.parentElement;
                }
                var targetPage = node || document.getElementById('page1');

                // 替换 font[size="7"] 为 span[style="font-size: size"]
                targetPage.querySelectorAll('font[size="7"]').forEach(function(font) {
                    var newSpan = document.createElement('span');
                    newSpan.style.fontSize = size;
                    while (font.firstChild) newSpan.appendChild(font.firstChild);
                    font.parentNode.replaceChild(newSpan, font);
                });

                // 部分浏览器生成 span[style*="xxx-large"] 也要处理
                targetPage.querySelectorAll('span').forEach(function(sp) {
                    var fs = sp.style.fontSize;
                    if (fs === 'xxx-large' || fs === '48px' || fs === '7') {
                        sp.style.fontSize = size;
                    }
                });
            }
            autoSave();
        }

        // 绑定字号选择器
        var fontSizeSelect = document.getElementById('fontSize');
        fontSizeSelect.addEventListener('change', function() {
            setFontSize(this.value);
        });
        // 键盘无障碍操作也支持
        fontSizeSelect.addEventListener('keyup', function(e) {
            if (e.key === 'Enter') setFontSize(this.value);
        });

        // ============ 字数统计 ============
        function getPageCharCount(page) {
            return (page.innerText || '').replace(/\s/g, '').length;
        }

        var lengthCheckTimer = null;
        function scheduleLengthCheck() {
            clearTimeout(lengthCheckTimer);
            lengthCheckTimer = setTimeout(checkLengthAndPaginate, 400);
        }

        function placeCaretAtStart(page) {
            try {
                var range = document.createRange();
                range.selectNodeContents(page);
                range.collapse(true);
                var sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
            } catch(e) {}
        }

        function checkLengthAndPaginate() {
            if (isMobile()) return;
            var activePage = document.activeElement;
            if (!activePage || !activePage.classList || !activePage.classList.contains('editor-page')) return;

            var count = getPageCharCount(activePage);
            if (count < MAX_CHARS_PER_PAGE) return;

            var sel = window.getSelection();
            if (!sel.rangeCount) return;
            var range = sel.getRangeAt(0);

            try {
                var afterRange = document.createRange();
                afterRange.setStart(range.endContainer, range.endOffset);
                afterRange.setEndAfter(activePage.lastChild);
                var remainingText = afterRange.toString();
                if (remainingText.length > 200) return;
            } catch(e) { return; }

            var nextPage = activePage.nextElementSibling;
            if (!nextPage || !nextPage.classList.contains('editor-page')) nextPage = createNewPage();

            try {
                var splitRange = document.createRange();
                splitRange.setStart(range.endContainer, range.endOffset);
                var lastChild = activePage.lastChild;
                if (lastChild) splitRange.setEndAfter(lastChild);
                var extracted = splitRange.extractContents();
                if (extracted.textContent.trim() || (extracted.querySelector && extracted.querySelector('img, table, hr, .shape-rect, .shape-circle, .shape-arrow'))) {
                    nextPage.insertBefore(extracted, nextPage.firstChild);
                }
                nextPage.focus();
                placeCaretAtStart(nextPage);
                autoSave(); updateCount();
            } catch(e) { console.error('分页失败:', e); }
        }

        // ============ 自动保存 ============
        function saveToStorage() {
            try {
                var allContent = getAllPages().map(function(p) { return p.innerHTML; }).join('<!--PAGE_BREAK-->');
                localStorage.setItem(STORAGE_KEY, allContent);
                return true;
            } catch(e) { return false; }
        }
        function autoSave() {
            saveStatus.textContent = '保存中...';
            clearTimeout(saveTimer);
            saveTimer = setTimeout(function() {
                if (saveToStorage()) saveStatus.textContent = '✓ 已保存';
                else saveStatus.textContent = '⚠ 保存失败';
            }, 300);
        }

        function updateCount() {
            var allText = '';
            getAllPages().forEach(function(p) { allText += p.innerText || ''; });
            var chars = allText.replace(/\s/g, '').length;
            var lines = allText.split('\n').length;
            status.textContent = '字符数：' + chars + ' | 行数：' + lines + ' | 页数：' + getAllPages().length;
        }
        updateCount();

        function exec(cmd, value) {
            restoreCurrentSelection();
            var activePage = document.activeElement;
            if (!activePage || !activePage.classList || !activePage.classList.contains('editor-page')) {
                activePage = document.getElementById('page1');
                activePage.focus();
            }
            document.execCommand(cmd, false, value || null);
            autoSave();
            if (!isMobile()) scheduleLengthCheck();
        }

        // ============ 下载 .docx ============
        function downloadDocx() {
            if (typeof htmlDocx === 'undefined') { alert('docx 库尚未加载'); return false; }
            var allContent = '';
            getAllPages().forEach(function(p, i) {
                if (i > 0) allContent += '<div style="page-break-before: always;"></div>';
                allContent += p.innerHTML;
            });
            var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{font-family:"Microsoft YaHei",Arial;font-size:15px;line-height:1.8;} table{border-collapse:collapse;width:100%;} td{border:1px solid #ccc;padding:8px;} h1{font-size:28px;font-weight:800;} h2{font-size:24px;font-weight:700;} h3{font-size:20px;font-weight:700;} h4{font-size:18px;font-weight:700;}</style></head><body>' + allContent + '</body></html>';
            var blob = htmlDocx.asBlob(html, { orientation: 'portrait', margins: { top: 720, right: 720, bottom: 720, left: 720 } });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'Nortbook_Document.docx';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            saveStatus.textContent = '✓ 已下载 .docx';
            return true;
        }

        // ============ 工具栏绑定 ============
        ['boldBtn', 'italicBtn', 'underlineBtn', 'strikeBtn'].forEach(function(id) {
            document.getElementById(id).addEventListener('click', function() {
                var cmd = { boldBtn: 'bold', italicBtn: 'italic', underlineBtn: 'underline', strikeBtn: 'strikeThrough' }[id];
                exec(cmd); this.classList.toggle('active');
            });
        });

        document.getElementById('fontFamily').addEventListener('change', function() { exec('fontName', this.value); });

        document.getElementById('styleSelect').addEventListener('change', function() {
            exec('formatBlock', this.value);
        });

        document.getElementById('textColor').addEventListener('input', function() { exec('foreColor', this.value); });
        document.getElementById('bgColor').addEventListener('input', function() { exec('hiliteColor', this.value); });

        document.getElementById('lineHeight').addEventListener('change', function() {
            restoreCurrentSelection();
            var lh = this.value;
            document.execCommand('styleWithCSS', false, true);
            var sel = window.getSelection();
            if (sel.rangeCount) {
                var range = sel.getRangeAt(0);
                var container = range.commonAncestorContainer;
                var block = container.nodeType === 1 ? container : container.parentElement;
                while (block && block.classList && !block.classList.contains('editor-page') && !/^(P|DIV|H[1-6]|LI|BLOCKQUOTE)$/.test(block.tagName)) block = block.parentElement;
                if (block && !block.classList.contains('editor-page')) block.style.lineHeight = lh;
            }
            autoSave();
        });

        // ============ 面板控制 ============
        function hideAllPanels() {
            document.querySelectorAll('.dropdown-panel').forEach(function(p) { p.classList.remove('show'); });
        }
        function togglePanel(btnId, panelId) {
            document.getElementById(btnId).addEventListener('click', function(e) {
                e.stopPropagation();
                var panel = document.getElementById(panelId);
                var wasOpen = panel.classList.contains('show');
                hideAllPanels();
                if (!wasOpen) panel.classList.add('show');
            });
        }
        togglePanel('insertMenuBtn', 'insertMenuPanel');
        togglePanel('symbolMenuBtn', 'symbolMenuPanel');
        togglePanel('findMenuBtn', 'findMenuPanel');
        document.addEventListener('click', function(e) { if (!e.target.closest('.toolbar-group')) hideAllPanels(); });

        // ============ 符号、特殊字符、公式 ============
        var SYMBOLS = ['±','×','÷','≠','≤','≥','∞','√','∑','∏','∫','∂','π','θ','α','β','γ','δ','λ','μ','σ','φ','ω','∈','∉','⊂','⊃','∪','∩','∀','∃','→','←','↑','↓','↔','⇒','⇔','°','′','″','¥','€','£','¢','§','¶','†','‡','•','…','‰','％','＃','＆','＊','＋','－','＝','＜','＞'];
        var symbolGrid = document.getElementById('symbolGrid');
        SYMBOLS.forEach(function(s) { var b = document.createElement('button'); b.textContent = s; b.addEventListener('click', function() { exec('insertText', s); hideAllPanels(); }); symbolGrid.appendChild(b); });

        var SPECIALS = ['©','®','™','℠','℃','℉','№','℗','℅','‰','†','‡','§','¶','•','…','–','—','‘','’','“','”','«','»','‹','›','¡','¿','×','÷','±','∞','√','∑','∏','∫','π','α','β','γ','δ','ε','ζ','η','θ','ι','κ','λ','μ','ν','ξ','ο','ρ','σ','τ','υ','φ','χ','ψ','ω','←','→','↑','↓','↔','⇒','⇔','★','☆','♥','♦','♣','♠','✓','✗','✈','☀','☁','☂','☃','☎','✉','✏','✂','✆','©'];
        var specialGrid = document.getElementById('specialGrid');
        SPECIALS.forEach(function(s) { var b = document.createElement('button'); b.textContent = s; b.addEventListener('click', function() { exec('insertText', s); hideAllPanels(); }); specialGrid.appendChild(b); });

        var FORMULAS = [
            { name: '二次公式', latex: 'x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}' },
            { name: '勾股定理', latex: 'a^2 + b^2 = c^2' },
            { name: '欧拉恒等式', latex: 'e^{i\\pi} + 1 = 0' },
            { name: '质能方程', latex: 'E = mc^2' },
            { name: '求和', latex: '\\sum_{i=1}^{n} i = \\frac{n(n+1)}{2}' },
            { name: '积分', latex: '\\int_{a}^{b} f(x) \\, dx = F(b) - F(a)' },
            { name: '极限', latex: '\\lim_{x \\to 0} \\frac{\\sin x}{x} = 1' },
            { name: '分数', latex: '\\frac{a}{b}' },
            { name: '根号', latex: '\\sqrt{x}' }
        ];
        var formulaList = document.getElementById('formulaList');
        FORMULAS.forEach(function(f) { var b = document.createElement('button'); b.textContent = f.name + '：' + f.latex; b.style.cssText = 'padding:6px 10px;font-size:12px;background:#fafafa;border:1px solid #e0e0e0;border-radius:4px;cursor:pointer;text-align:left;'; b.addEventListener('click', function() { insertFormula(f.latex); hideAllPanels(); }); formulaList.appendChild(b); });

        function insertFormula(latex) {
            if (typeof katex === 'undefined') { alert('KaTeX 未加载'); return; }
            try {
                var html = katex.renderToString(latex, { throwOnError: false, displayMode: false });
                exec('insertHTML', '<span class="katex-inline" contenteditable="false" data-latex="' + latex.replace(/"/g, '&quot;') + '">' + html + '</span>&nbsp;');
            } catch(e) { alert('公式渲染失败：' + e.message); }
        }
        document.getElementById('formulaInsertBtn').addEventListener('click', function() {
            var val = document.getElementById('formulaInput').value.trim();
            if (!val) return;
            insertFormula(val);
            document.getElementById('formulaInput').value = '';
        });

        // ============ 插入操作 ============
        document.getElementById('insertLink').addEventListener('click', function() { var url = prompt('请输入链接地址：', 'https://'); if (url) exec('createLink', url); hideAllPanels(); });
        document.getElementById('insertImage').addEventListener('click', function() { var input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*'; input.onchange = function(e) { var file = e.target.files[0]; if (!file) return; var reader = new FileReader(); reader.onload = function(ev) { exec('insertImage', ev.target.result); }; reader.readAsDataURL(file); }; input.click(); hideAllPanels(); });
        document.getElementById('insertTable').addEventListener('click', function() { var rows = parseInt(prompt('表格行数：', '3')); var cols = parseInt(prompt('表格列数：', '3')); if (!rows || !cols) { hideAllPanels(); return; } var html = '<table>'; for (var i = 0; i < rows; i++) { html += '<tr>'; for (var j = 0; j < cols; j++) html += '<td><br></td>'; html += '</tr>'; } html += '</table><p><br></p>'; document.execCommand('insertHTML', false, html); autoSave(); hideAllPanels(); });
        document.getElementById('insertTextBox').addEventListener('click', function() { exec('insertHTML', '<div class="text-box" contenteditable="true">在此输入文本...</div><p><br></p>'); hideAllPanels(); });
        document.getElementById('insertBlock').addEventListener('click', function() { exec('insertHTML', '<div class="content-block" contenteditable="true"><strong>内容块标题</strong><p>在此输入内容...</p></div><p><br></p>'); hideAllPanels(); });
        document.getElementById('insertPageBreak').addEventListener('click', function() {
            var activePage = document.activeElement;
            if (!activePage || !activePage.classList.contains('editor-page')) activePage = document.getElementById('page1');
            var newPage = createNewPage();
            newPage.focus();
            placeCaretAtStart(newPage);
            hideAllPanels();
            autoSave();
            updateCount();
        });
        document.getElementById('tabStopBtn').addEventListener('click', function() { exec('insertHTML', '<span class="tab-stop" contenteditable="false" style="display:inline-block;width:40px;border-bottom:1px dotted #999;height:1em;"></span>'); hideAllPanels(); });
        document.getElementById('insertHr').addEventListener('click', function() { exec('insertHTML', '<hr><p><br></p>'); hideAllPanels(); });

        document.querySelectorAll('#insertMenuPanel button[data-shape]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var shape = this.dataset.shape;
                var html = '';
                if (shape === 'rect') html = '<div class="shape-rect" contenteditable="false"></div>';
                else if (shape === 'circle') html = '<div class="shape-circle" contenteditable="false"></div>';
                else if (shape === 'arrow') html = '<div class="shape-arrow" contenteditable="false"></div>';
                exec('insertHTML', html); hideAllPanels();
            });
        });

        document.getElementById('undoBtn').addEventListener('click', function() { exec('undo'); });
        document.getElementById('redoBtn').addEventListener('click', function() { exec('redo'); });
        document.getElementById('clearFormat').addEventListener('click', function() { exec('removeFormat'); });

        // ============ 导入 ============
        var fileInput = document.getElementById('fileInput');
        document.getElementById('importBtn').addEventListener('click', function() { fileInput.click(); });
        fileInput.addEventListener('change', function(e) {
            var file = e.target.files[0]; if (!file) return;
            if (!file.name.toLowerCase().endsWith('.docx')) { alert('仅支持导入 .docx'); fileInput.value = ''; return; }
            if (typeof mammoth === 'undefined') { alert('mammoth 库尚未加载'); return; }
            var reader = new FileReader();
            reader.onload = function(ev) {
                mammoth.convertToHtml({ arrayBuffer: ev.target.result })
                    .then(function(result) {
                        getAllPages().forEach(function(p, i) { if (i > 0) p.remove(); });
                        document.getElementById('page1').innerHTML = result.value;
                        autoSave(); updateCount();
                        saveStatus.textContent = '✓ 已导入 ' + file.name;
                    }).catch(function(err) { alert('导入失败：' + err.message); });
            };
            reader.readAsArrayBuffer(file);
            fileInput.value = '';
        });

        // ============ 保存按钮 ============
        var saveBtn = document.getElementById('saveBtn');
        var newSaveBtn = saveBtn.cloneNode(true);
        saveBtn.parentNode.replaceChild(newSaveBtn, saveBtn);
        newSaveBtn.addEventListener('click', function() {
            if (downloadDocx()) {
                try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
                isHandlingUnload = true;
                saveStatus.textContent = '✓ 已下载并清理缓存';
            }
        });

        // ============ 缩放 ============
        function applyZoom() {
            if (isMobile()) {
                pagesContainer.style.transform = 'none';
                return;
            }
            pagesContainer.style.transform = 'scale(' + currentZoom + ')';
            document.getElementById('zoomDisplay').textContent = Math.round(currentZoom * 100) + '%';
        }
        document.getElementById('zoomIn').addEventListener('click', function() { currentZoom = Math.min(2.0, currentZoom + 0.1); applyZoom(); });
        document.getElementById('zoomOut').addEventListener('click', function() { currentZoom = Math.max(0.5, currentZoom - 0.1); applyZoom(); });
        document.getElementById('zoomReset').addEventListener('click', function() { currentZoom = 1.0; applyZoom(); });
        window.addEventListener('resize', function() { applyZoom(); });

        // ============ 快捷键 ============
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'b') { e.preventDefault(); exec('bold'); }
                if (e.key === 'i') { e.preventDefault(); exec('italic'); }
                if (e.key === 'u') { e.preventDefault(); exec('underline'); }
                if (e.key === 'z' && !e.shiftKey) { e.preventDefault(); exec('undo'); }
                if (e.key === 'y' || (e.key === 'z' && e.shiftKey)) { e.preventDefault(); exec('redo'); }
                if (e.key === 'f') { e.preventDefault(); document.getElementById('findMenuBtn').click(); }
                if (e.key === 's') { e.preventDefault(); newSaveBtn.click(); }
            }
            if (e.key === 'Escape') hideAllPanels();
        });

        // ============ 关闭提示 ============
        window.addEventListener('beforeunload', function(e) {
            var allText = '';
            getAllPages().forEach(function(p) { allText += p.innerText || ''; });
            if (!allText.trim()) return;
            if (isHandlingUnload) return;
            e.preventDefault();
            e.returnValue = '您有未下载的文档。是否保存并退出？';
            return e.returnValue;
        });
        window.addEventListener('unload', function() {
            var allText = '';
            getAllPages().forEach(function(p) { allText += p.innerText || ''; });
            if (allText.trim() !== '' && !isHandlingUnload) {
                try { downloadDocx(); } catch (err) {}
                try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
            }
        });

        // 初始化
        setTimeout(function() { applyZoom(); updateCount(); }, 100);
    })();
    </script>
</body>
</html>
